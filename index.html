<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Nombres</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>🌍 Generador de Nombres</h1>
      <p>Elige una o varias nacionalidades, el género y genera hasta 20 nombres de forma aleatoria.</p>
    </header>

    <section class="options">
      <!-- Nacionalidad (selección múltiple) -->
      <div class="option-group">
        <h2>🗺️ Nacionalidad <span class="hint">(elige una o varias)</span></h2>
        <div class="option-row" id="nationalityGroup">
          <button class="option-btn active" data-nationality="alemana">🇩🇪 Alemán</button>
          <button class="option-btn" data-nationality="mexicana">🇲🇽 Mexicano</button>
          <button class="option-btn" data-nationality="china">🇨🇳 Chino</button>
          <button class="option-btn" data-nationality="francesa">🇫🇷 Francés</button>
        </div>
      </div>

      <!-- Género -->
      <div class="option-group">
        <h2>⚧ Género</h2>
        <div class="option-row gender-row" id="genderGroup">
          <button class="gender-btn masculine active" data-gender="masculino">♂ Masculino</button>
          <button class="gender-btn feminine" data-gender="femenino">♀ Femenino</button>
        </div>
      </div>

      <!-- Cantidad y botón -->
      <div class="option-group">
        <h2>🔢 Cantidad <span class="hint">(máx. 20)</span></h2>
        <div class="generate-row">
          <input type="number" id="quantity" min="1" max="20" value="20" />
          <button id="generateBtn">🎲 Generar nombres</button>
        </div>
      </div>
    </section>

    <!-- Resultados -->
    <section class="results">
      <p id="resultInfo" class="result-info"></p>
      <ul id="namesList" class="names-list masculine"></ul>
      <p id="emptyMessage" class="empty-message">
        Pulsa "Generar nombres" para comenzar.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
