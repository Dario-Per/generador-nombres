<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Nombres Alemanes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>🇩🇪 Generador de Nombres Alemanes</h1>
      <p>Genera hasta 10 sugerencias de nombres de origen alemán de forma aleatoria.</p>
    </header>

    <section class="controls">
      <label for="quantity">Cantidad de nombres:</label>
      <input
        type="number"
        id="quantity"
        min="1"
        max="10"
        value="10"
      />
      <button id="generateBtn">🎲 Generar nombres</button>
    </section>

    <section class="results">
      <ul id="namesList" class="names-list"></ul>
      <p id="emptyMessage" class="empty-message">
        Pulsa "Generar nombres" para comenzar.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
